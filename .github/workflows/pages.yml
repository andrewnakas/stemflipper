name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node scripts/make_ci_fixture.mjs
      - run: npm run build
      - name: Headless smoke test
        # Five scenarios: the deep bundle checks, the front door, a whole run against a
        # mock Space that replays SSE frames recorded from the real one (including the
        # ZeroGPU quota refusal, which is the normal way a visitor's run fails), and the
        # two offline paths — a song kept in IndexedDB and a downloaded bundle zip.
        run: |
          npx puppeteer browsers install chrome
          npm run preview &
          npx wait-on http://localhost:4173/stemflipper/ --timeout 60000
          node scripts/mock_backend.mjs --port 7861 &
          node scripts/mock_backend.mjs --port 7862 --mode quota &
          npx wait-on http://localhost:7861 http://localhost:7862 --timeout 30000
          node scripts/web_smoke.mjs --scenario fixture
          node scripts/web_smoke.mjs --scenario demo
          node scripts/web_smoke.mjs --scenario upload --backend http://localhost:7861
          node scripts/web_smoke.mjs --scenario quota   --backend http://localhost:7862
          node scripts/web_smoke.mjs --scenario keep    --fixture demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
