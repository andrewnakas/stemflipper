<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>StemFlipper</title>
    <link rel="canonical" href="https://audiosaw.com/stemflipper/" />
    <meta name="robots" content="noindex" />
    <!--
      v2 served the editor here. Keep every old link working — ?fixture=, ?bundle= and
      ?backend= all still mean something — by carrying the query string across to the app.
    -->

      location.replace("./" + location.search + (location.hash || "#/"));
    </script>

  <body>
    <p style="font: 14px system-ui; padding: 24px">
      StemFlipper has moved to <a href="./">this page</a>.
    </p>
